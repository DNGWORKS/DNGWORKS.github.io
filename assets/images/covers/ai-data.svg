<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: lớp dữ liệu nối tín hiệu rời rạc thành quyết định">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F8FF"/>
      <stop offset="0.5" stop-color="#E6F1FD"/>
      <stop offset="1" stop-color="#DFF2EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ad-bg)"/>

  <!-- scattered signals resolving into an ordered lattice -->
  <g stroke="#C2D5EE" stroke-width="1.5">
    <path d="M160 120 H1040 M160 240 H1040 M160 360 H1040 M160 480 H1040"/>
    <path d="M160 120 V480 M336 120 V480 M512 120 V480 M688 120 V480 M864 120 V480 M1040 120 V480"/>
  </g>

  <g stroke="#285BE8" stroke-width="2.5" fill="none">
    <path d="M160 452 L336 404 L512 300 L688 264 L864 186 L1040 150"/>
  </g>

  <g fill="#285BE8">
    <rect x="153" y="445" width="14" height="14"/>
    <rect x="329" y="397" width="14" height="14"/>
    <rect x="505" y="293" width="14" height="14"/>
  </g>
  <g fill="#12BCA4">
    <rect x="681" y="257" width="14" height="14"/>
    <rect x="857" y="179" width="14" height="14"/>
    <rect x="1033" y="143" width="14" height="14"/>
  </g>

  <!-- the decision layer the signals feed -->
  <rect x="160" y="530" width="880" height="72" rx="10" fill="#CFE0FA" opacity=".9"/>
  <rect x="160" y="530" width="880" height="72" rx="10" fill="none" stroke="#1B46C4" stroke-width="2"/>
  <g fill="#1B46C4" opacity=".55">
    <rect x="200" y="558" width="120" height="16" rx="4"/>
    <rect x="352" y="558" width="196" height="16" rx="4"/>
    <rect x="580" y="558" width="92" height="16" rx="4"/>
    <rect x="704" y="558" width="156" height="16" rx="4"/>
  </g>
</svg>
