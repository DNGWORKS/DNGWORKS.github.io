<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: ngân sách khuếch đại một hệ thống, kể cả điểm yếu của nó">
  <defs>
    <linearGradient id="gs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAFF"/>
      <stop offset="0.55" stop-color="#E5EFFC"/>
      <stop offset="1" stop-color="#DBEEE9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#gs-bg)"/>

  <!-- the same structure at two scales: spend magnifies whatever is there -->
  <g>
    <rect x="150" y="434" width="300" height="52" rx="8" fill="#CFE0FA"/>
    <rect x="150" y="434" width="300" height="52" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>
    <rect x="186" y="366" width="228" height="52" rx="8" fill="#D9E8FB"/>
    <rect x="186" y="366" width="228" height="52" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>
    <rect x="222" y="298" width="156" height="52" rx="8" fill="#F6E0CE"/>
    <rect x="222" y="298" width="156" height="52" rx="8" fill="none" stroke="#D96C2E" stroke-width="2"/>
  </g>

  <g>
    <rect x="612" y="470" width="438" height="76" rx="10" fill="#CFE0FA"/>
    <rect x="612" y="470" width="438" height="76" rx="10" fill="none" stroke="#1B46C4" stroke-width="2.5"/>
    <rect x="665" y="372" width="332" height="76" rx="10" fill="#D9E8FB"/>
    <rect x="665" y="372" width="332" height="76" rx="10" fill="none" stroke="#1B46C4" stroke-width="2.5"/>
    <rect x="718" y="274" width="226" height="76" rx="10" fill="#F6D9C4"/>
    <rect x="718" y="274" width="226" height="76" rx="10" fill="none" stroke="#D96C2E" stroke-width="3"/>
  </g>

  <!-- the weak stage is the one that grows the most -->
  <path d="M378 324 C 480 324, 560 300, 718 312" stroke="#D96C2E" stroke-width="2.5" fill="none" stroke-dasharray="10 9"/>
  <rect x="712" y="306" width="16" height="16" fill="#F18B53"/>
  <rect x="370" y="316" width="16" height="16" fill="#F18B53"/>

  <path d="M150 596 H1050" stroke="#C2D5EE" stroke-width="2"/>
  <path d="M150 596 V612 M450 596 V612 M612 596 V612 M1050 596 V612" stroke="#C2D5EE" stroke-width="2"/>
</svg>
