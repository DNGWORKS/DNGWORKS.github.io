<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: nhịp phản hồi lead theo thời hạn đã định">
  <defs>
    <linearGradient id="lr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F9FF"/>
      <stop offset="0.5" stop-color="#E6F0FC"/>
      <stop offset="1" stop-color="#FBEEE3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#lr-bg)"/>

  <!-- a timeline with a response window that closes -->
  <path d="M150 338 H1050" stroke="#C2D5EE" stroke-width="2"/>
  <g stroke="#C2D5EE" stroke-width="2">
    <path d="M150 324 V352 M330 324 V352 M510 324 V352 M690 324 V352 M870 324 V352 M1050 324 V352"/>
  </g>

  <!-- inside the window: a fast, owned reply -->
  <rect x="150" y="214" width="180" height="88" rx="8" fill="#CFEDE5"/>
  <rect x="150" y="214" width="180" height="88" rx="8" fill="none" stroke="#0E8F7D" stroke-width="2.5"/>
  <rect x="330" y="214" width="180" height="88" rx="8" fill="#DCF1EB" opacity=".8"/>
  <rect x="330" y="214" width="180" height="88" rx="8" fill="none" stroke="#0E8F7D" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- outside it: attention decays -->
  <rect x="510" y="374" width="180" height="88" rx="8" fill="#F6E0CE" opacity=".9"/>
  <rect x="510" y="374" width="180" height="88" rx="8" fill="none" stroke="#D96C2E" stroke-width="2"/>
  <rect x="690" y="374" width="180" height="88" rx="8" fill="#F6E6DA" opacity=".7"/>
  <rect x="690" y="374" width="180" height="88" rx="8" fill="none" stroke="#D96C2E" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="870" y="374" width="180" height="88" rx="8" fill="#F4EDE7" opacity=".6"/>
  <rect x="870" y="374" width="180" height="88" rx="8" fill="none" stroke="#C2D5EE" stroke-width="2" stroke-dasharray="6 10"/>

  <g fill="#12BCA4">
    <rect x="142" y="330" width="16" height="16"/>
    <rect x="322" y="330" width="16" height="16"/>
  </g>
  <g fill="#F18B53">
    <rect x="502" y="330" width="16" height="16"/>
    <rect x="682" y="330" width="16" height="16"/>
  </g>
  <rect x="862" y="330" width="16" height="16" fill="#C2D5EE"/>
  <rect x="1042" y="330" width="16" height="16" fill="#C2D5EE"/>
</svg>
