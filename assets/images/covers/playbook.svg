<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: quy trình từng bước, mỗi bước có mốc kiểm tra">
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.6" stop-color="#EAF2FD"/>
      <stop offset="1" stop-color="#FAEFE4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pb-bg)"/>

  <!-- an ascending flight of steps: an ordered procedure -->
  <g>
    <rect x="140" y="470" width="220" height="104" rx="8" fill="#CFE0FA"/>
    <rect x="140" y="470" width="220" height="104" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>

    <rect x="360" y="386" width="220" height="188" rx="8" fill="#D6E6FB"/>
    <rect x="360" y="386" width="220" height="188" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>

    <rect x="580" y="302" width="220" height="272" rx="8" fill="#D5EBE4"/>
    <rect x="580" y="302" width="220" height="272" rx="8" fill="none" stroke="#0E8F7D" stroke-width="2"/>

    <rect x="800" y="218" width="220" height="356" rx="8" fill="#CBE8DF"/>
    <rect x="800" y="218" width="220" height="356" rx="8" fill="none" stroke="#0E8F7D" stroke-width="2"/>
  </g>

  <!-- the checkpoint at the top of each step -->
  <g fill="#285BE8">
    <rect x="242" y="442" width="16" height="16"/>
    <rect x="462" y="358" width="16" height="16"/>
  </g>
  <g fill="#12BCA4">
    <rect x="682" y="274" width="16" height="16"/>
    <rect x="902" y="190" width="16" height="16"/>
  </g>
  <path d="M250 442 V414 M470 358 V330 M690 274 V246 M910 190 V162"
        stroke="#C2D5EE" stroke-width="2"/>
  <path d="M140 136 H1020" stroke="#C2D5EE" stroke-width="2"/>
</svg>
