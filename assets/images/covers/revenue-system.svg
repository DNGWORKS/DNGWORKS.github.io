<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: hệ thống doanh thu với một mắt xích hở">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="0.55" stop-color="#E7F0FD"/>
      <stop offset="1" stop-color="#DCEFEA"/>
    </linearGradient>
    <linearGradient id="rs-plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FBCEE"/>
      <stop offset="1" stop-color="#C6D9F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#rs-bg)"/>

  <!-- the funnel as four stages, each narrower than the last -->
  <g>
    <rect x="200" y="132" width="800" height="78" rx="10" fill="url(#rs-plate)" opacity=".9"/>
    <rect x="200" y="132" width="800" height="78" rx="10" fill="none" stroke="#1B46C4" stroke-width="2"/>

    <rect x="266" y="256" width="668" height="78" rx="10" fill="url(#rs-plate)" opacity=".82"/>
    <rect x="266" y="256" width="668" height="78" rx="10" fill="none" stroke="#1B46C4" stroke-width="2"/>

    <!-- the stage that leaks: it is broken into two pieces with a gap -->
    <rect x="332" y="380" width="256" height="78" rx="10" fill="#F6D9C4" opacity=".95"/>
    <rect x="332" y="380" width="256" height="78" rx="10" fill="none" stroke="#D96C2E" stroke-width="2"/>
    <rect x="652" y="380" width="216" height="78" rx="10" fill="#F6D9C4" opacity=".95"/>
    <rect x="652" y="380" width="216" height="78" rx="10" fill="none" stroke="#D96C2E" stroke-width="2"/>
    <path d="M596 419 h48" stroke="#D96C2E" stroke-width="3" stroke-dasharray="9 11" stroke-linecap="round"/>

    <rect x="398" y="504" width="404" height="78" rx="10" fill="#BCE6DC" opacity=".95"/>
    <rect x="398" y="504" width="404" height="78" rx="10" fill="none" stroke="#0E8F7D" stroke-width="2"/>
  </g>

  <!-- measured nodes down the left edge -->
  <g fill="#12BCA4">
    <rect x="150" y="164" width="12" height="12"/>
    <rect x="216" y="288" width="12" height="12"/>
    <rect x="282" y="412" width="12" height="12" fill="#F18B53"/>
    <rect x="348" y="536" width="12" height="12"/>
  </g>
  <path d="M156 176 V294 M222 300 V418 M288 424 V542" stroke="#C2D5EE" stroke-width="2"/>
</svg>
