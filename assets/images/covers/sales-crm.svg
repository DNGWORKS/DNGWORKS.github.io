<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"
     aria-label="Đồ hoạ biên tập DNGWORKS: luồng bàn giao lead giữa marketing và bán hàng">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="0.6" stop-color="#E3EFFC"/>
      <stop offset="1" stop-color="#D9EAF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sc-bg)"/>

  <!-- two columns of records, joined by an owned handover path -->
  <g>
    <rect x="152" y="130" width="330" height="64" rx="8" fill="#FFFFFF" opacity=".92"/>
    <rect x="152" y="130" width="330" height="64" rx="8" fill="none" stroke="#C2D5EE" stroke-width="2"/>
    <rect x="152" y="222" width="330" height="64" rx="8" fill="#FFFFFF" opacity=".92"/>
    <rect x="152" y="222" width="330" height="64" rx="8" fill="none" stroke="#C2D5EE" stroke-width="2"/>
    <rect x="152" y="314" width="330" height="64" rx="8" fill="#FFFFFF" opacity=".92"/>
    <rect x="152" y="314" width="330" height="64" rx="8" fill="none" stroke="#C2D5EE" stroke-width="2"/>
    <rect x="152" y="406" width="330" height="64" rx="8" fill="#FFFFFF" opacity=".92"/>
    <rect x="152" y="406" width="330" height="64" rx="8" fill="none" stroke="#C2D5EE" stroke-width="2"/>

    <rect x="718" y="176" width="330" height="64" rx="8" fill="#DCE8FD"/>
    <rect x="718" y="176" width="330" height="64" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>
    <rect x="718" y="300" width="330" height="64" rx="8" fill="#CFEDE5"/>
    <rect x="718" y="300" width="330" height="64" rx="8" fill="none" stroke="#0E8F7D" stroke-width="2"/>
    <rect x="718" y="424" width="330" height="64" rx="8" fill="#DCE8FD"/>
    <rect x="718" y="424" width="330" height="64" rx="8" fill="none" stroke="#1B46C4" stroke-width="2"/>
  </g>

  <!-- the handover: every lead has one owner and one route -->
  <g fill="none" stroke="#1B46C4" stroke-width="2.5">
    <path d="M482 162 C 600 162, 600 208, 718 208"/>
    <path d="M482 254 C 600 254, 600 332, 718 332" stroke="#0E8F7D"/>
    <path d="M482 346 C 600 346, 600 332, 718 332" stroke="#0E8F7D"/>
    <path d="M482 438 C 600 438, 600 456, 718 456"/>
  </g>

  <g fill="#12BCA4">
    <rect x="476" y="156" width="12" height="12"/>
    <rect x="476" y="248" width="12" height="12"/>
    <rect x="476" y="340" width="12" height="12"/>
    <rect x="476" y="432" width="12" height="12"/>
  </g>
  <g fill="#285BE8">
    <rect x="712" y="202" width="12" height="12"/>
    <rect x="712" y="326" width="12" height="12"/>
    <rect x="712" y="450" width="12" height="12"/>
  </g>

  <path d="M152 540 H1048" stroke="#C2D5EE" stroke-width="2"/>
  <path d="M152 540 V556 M482 540 V556 M718 540 V556 M1048 540 V556" stroke="#C2D5EE" stroke-width="2"/>
</svg>
